# Attaches to the pre-existing shared Gateway in cleanbrain-me-system, same
# as english-core-speaking's httproute.yaml. Does NOT create the Gateway,
# cert-manager, or ClusterIssuer.
#
# TLS: this hostname is the bare apex domain (cleanbrain.me), not a
# *.cleanbrain.me subdomain, so it needed its own HTTPS listener on the
# live Gateway (not tracked in this repository -- see README.md
# "Networking" > "Gateway") referencing a cleanbrain-me-entrance-tls
# Secret. That listener has been added and cert-manager auto-issued the
# certificate via its Gateway API integration -- confirmed working
# end to end (curl https://cleanbrain.me returns HTTP/2 200). See
# README.md "TLS" > "How a TLS Secret actually gets created" for the
# mechanism and exact listener that was applied.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: entrance
  namespace: cleanbrain-me-entrance
spec:
  parentRefs:
    - name: cleanbrain-me-gateway
      namespace: cleanbrain-me-system
  hostnames:
    - cleanbrain.me
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: web
          port: 80
