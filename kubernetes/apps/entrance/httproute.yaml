# Attaches to the pre-existing shared Gateway in cleanbrain-me-system, same
# as english-core-speaking's httproute.yaml. Does NOT create the Gateway,
# cert-manager, or ClusterIssuer.
#
# UNVERIFIED: unlike every other app so far, this route's hostname is the
# bare root domain (cleanbrain.me), not a *.cleanbrain.me subdomain. Every
# existing TLS Secret (see README.md "TLS") was issued per-hostname via
# HTTP-01 for a subdomain; none currently covers the bare apex domain. This
# manifest assumes a TLS Secret for the bare "cleanbrain.me" hostname will
# exist in cleanbrain-me-system (named cleanbrain-me-entrance-tls, following
# the existing <app>-tls naming convention) before this HTTPRoute is applied
# -- confirm with the cluster administrator whether the existing Gateway
# listener/cert-manager setup already covers this, or whether a new
# Certificate/HTTP-01 issuance needs to be requested for the apex domain
# first. Do not apply this file until that is confirmed.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: entrance
  namespace: cleanbrain-me-entrance
spec:
  parentRefs:
    - name: cleanbrain-me-gateway
      namespace: cleanbrain-me-system
  hostnames:
    - cleanbrain.me
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: web
          port: 80
