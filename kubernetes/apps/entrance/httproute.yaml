# Attaches to the pre-existing shared Gateway in cleanbrain-me-system, same
# as english-core-speaking's httproute.yaml. Does NOT create the Gateway,
# cert-manager, or ClusterIssuer.
#
# UNVERIFIED (TLS only -- DNS is confirmed, see README.md "DNS"): unlike
# every other app so far, this route's hostname is the bare root domain
# (cleanbrain.me), not a *.cleanbrain.me subdomain. Every existing TLS
# Secret was issued per-hostname via HTTP-01 for a subdomain; none
# currently covers the bare apex domain, and a Secret named
# cleanbrain-me-entrance-tls must exist in cleanbrain-me-system before this
# HTTPRoute is meaningfully applied (the route itself will apply fine
# either way, but the Gateway can't terminate TLS for this hostname without
# it). See README.md "TLS" for the diagnostic/issuance runbook -- do not
# apply this file until that Secret exists and the Gateway listener
# references it.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: entrance
  namespace: cleanbrain-me-entrance
spec:
  parentRefs:
    - name: cleanbrain-me-gateway
      namespace: cleanbrain-me-system
  hostnames:
    - cleanbrain.me
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: web
          port: 80
