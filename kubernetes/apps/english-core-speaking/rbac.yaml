# Least-privilege identity for the GitHub Actions SSH deploy bridge
# (.github/workflows/deploy.yml in the english-core-speaking repo).
#
# Scope: this Role is a namespaced Role (not ClusterRole), bound only inside
# cleanbrain-me-english-core-speaking, so it is structurally incapable of
# touching any other namespace -- including cleanbrain-me-system (Gateway,
# ClusterIssuer, cert-manager) -- no matter what verbs it's granted here.
#
# Applied once by the cluster administrator as part of bootstrap (see
# README.md "One-time server setup"). The CI identity itself has no
# permission to modify this file's resources (no rbac.authorization.k8s.io
# access is granted below), so it cannot escalate or re-scope itself.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-deployer
  namespace: cleanbrain-me-english-core-speaking
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ci-deployer
  namespace: cleanbrain-me-english-core-speaking
rules:
  # Exactly what `kubectl set image` (a patch) and `kubectl rollout status`
  # (get + watch) need, and nothing else. No create/update/delete, no verbs
  # on Secrets/ConfigMaps/Services/the postgres StatefulSet/PVCs.
  #
  # deploy.yml never calls `kubectl logs` or `kubectl describe pod` -- it
  # only runs `set image` and `rollout status` -- so this Role grants no
  # Pod or Pod-log access at all. `kubectl rollout status` on a Deployment
  # reads and watches only the Deployment object itself (spec.replicas vs.
  # status.{updatedReplicas,availableReplicas,replicas} and
  # metadata.generation vs. status.observedGeneration); it does not query
  # ReplicaSets or Pods, so this Role grants none of that either. If a
  # future change to deploy.yml adds `kubectl logs`/`describe pod` for
  # troubleshooting, extend this Role deliberately at that point rather
  # than granting it speculatively now.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["api", "web"]
    verbs: ["get", "patch"]
  # resourceNames can't scope "watch"/"list" (they filter get/patch/delete
  # only), so those two verbs are granted on the resource type -- still
  # confined to this namespace by the Role/RoleBinding boundary, and
  # `kubectl rollout status <name>` still only reports on the one
  # Deployment named on the command line.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-deployer
  namespace: cleanbrain-me-english-core-speaking
subjects:
  - kind: ServiceAccount
    name: ci-deployer
    namespace: cleanbrain-me-english-core-speaking
roleRef:
  kind: Role
  name: ci-deployer
  apiGroup: rbac.authorization.k8s.io
