# Attaches to the pre-existing shared Gateway in cleanbrain-me-system.
# Does NOT create the Gateway, cert-manager, ClusterIssuer, or TLS
# Certificate -- those already exist and are managed outside this app's
# manifests. Cross-namespace parentRef relies on the Gateway's listener
# already allowing routes from other namespaces (it does, by design, since
# it's meant to be shared across cleanbrain.me apps).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: english-core-speaking
  namespace: cleanbrain-me-english-core-speaking
spec:
  parentRefs:
    - name: cleanbrain-me-gateway
      namespace: cleanbrain-me-system
  hostnames:
    - english-core-speaking.cleanbrain.me
  rules:
    # /api first: HTTPRoute path matching is longest-prefix-wins regardless
    # of rule order, but listing the more specific match first keeps intent
    # obvious to a reader.
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: api
          port: 3000
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: web
          port: 80
