# Copy to secret.yaml (gitignored), fill in real values, then:
#   kubectl apply -f kubernetes/apps/english-core-speaking/secret.yaml
# Never commit the real file.
#
# Shared by both postgres (POSTGRES_*) and api (everything) via envFrom.
# DATABASE_URL must stay in sync with POSTGRES_USER/PASSWORD/DB below --
# Kubernetes Secrets don't support cross-field interpolation. "postgres" is
# the in-cluster Service name (kubernetes/apps/english-core-speaking/postgres/service.yaml),
# resolvable only inside the cleanbrain-me-english-core-speaking namespace.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: cleanbrain-me-english-core-speaking
type: Opaque
stringData:
  POSTGRES_DB: speaking_core
  POSTGRES_USER: speaking_core
  POSTGRES_PASSWORD: CHANGE_ME
  DATABASE_URL: postgresql://speaking_core:CHANGE_ME@postgres:5432/speaking_core?schema=public

  # Google Cloud Console > APIs & Services > Credentials.
  # The callback URL must exactly match an "Authorized redirect URI" on the
  # OAuth client -- update it there when the hostname changes.
  GOOGLE_CLIENT_ID: CHANGE_ME.apps.googleusercontent.com
  GOOGLE_CLIENT_SECRET: CHANGE_ME
  GOOGLE_CALLBACK_URL: https://english-core-speaking.cleanbrain.me/api/auth/google/callback

  # openssl rand -base64 48
  SESSION_SECRET: CHANGE_ME_LONG_RANDOM

  FRONTEND_ORIGIN: https://english-core-speaking.cleanbrain.me
