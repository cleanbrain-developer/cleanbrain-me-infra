# :latest here is a real, pullable tag by the time you bootstrap -- NOT a
# placeholder -- because deploy.yml's build-and-push job publishes both
# :latest and :<git-sha> on every push to main regardless of whether
# ENABLE_PRODUCTION_DEPLOY is set. This only holds if you push to main at
# least once BEFORE running "First-time deployment" in the README (that's
# the documented order); bootstrapping against an empty GHCR package would
# ImagePullBackOff. Ongoing deploys update the running Deployment's image
# via `kubectl set image` from CI with the immutable :<git-sha> tag and do
# NOT rewrite this file -- re-applying it as-is after a CI deploy will roll
# the cluster back to :latest as of that apply. Bump this tag manually if
# you want `kubectl apply` to stay authoritative again.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: cleanbrain-me-english-core-speaking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: ghcr.io/cleanbrain-developer/english-core-speaking-api:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: api-config
            - secretRef:
                name: app-secrets
          # Generous initial delays: the container applies pending Prisma
          # migrations and self-seeds ~1,450 rows before it starts listening
          # (see apps/api/Dockerfile CMD in the english-core-speaking repo),
          # which takes longer than a typical cold start on first boot
          # against an empty database.
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
