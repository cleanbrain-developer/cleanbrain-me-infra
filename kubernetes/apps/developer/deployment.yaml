# :latest is real by bootstrap time only if the cleanbrain-me-developer
# repo's main branch has been pushed at least once first (it has -- see
# that repo's Actions run history).
#
# Public GHCR image, same as cleanbrain-me-entrance and
# english-core-speaking -- no imagePullSecrets (see this repo's README
# "GHCR image pull authentication").
#
# Static nginx-served bundle (cleanbrain-me-developer's ADR-0003), same
# shape as cleanbrain-me-entrance -- not a running Next.js/Node server.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: cleanbrain-me-developer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: ghcr.io/cleanbrain-developer/cleanbrain-me-developer:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
