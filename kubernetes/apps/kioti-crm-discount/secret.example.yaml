# Copy to secret.yaml (gitignored), fill in real values, then:
#   kubectl apply -f kubernetes/apps/kioti-crm-discount/secret.yaml
# Never commit the real file.
#
# Consumed by the single "app" Deployment via envFrom. DATABASE_URL points at
# the SQLite file on the PersistentVolumeClaim mounted at /app/data (see
# pvc.yaml and deployment.yaml) -- it must stay in sync with that mount path.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: cleanbrain-me-kioti-crm-discount
type: Opaque
stringData:
  DATABASE_URL: file:/app/data/prod.db

  # Salesforce connected app (crm-kioti-usa.my.salesforce.com). Rotate these
  # before first production use -- see kioti-crm-discount-enhance-demo repo
  # history for why (a prior commit hardcoded real values into
  # docker-compose.yml; treat that client secret/password as burned).
  SF_DOMAIN: https://crm-kioti-usa.my.salesforce.com
  SF_CLIENT_ID: CHANGE_ME
  SF_CLIENT_SECRET: CHANGE_ME
  SF_USERNAME: CHANGE_ME
  SF_PASSWORD: CHANGE_ME
  SF_API_VERSION: v62.0
