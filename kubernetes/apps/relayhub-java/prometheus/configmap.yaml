# Scrapes the in-cluster "api" Service directly (no host.docker.internal trick needed here,
# unlike relayhub-java's local docker-compose.yml — the app runs in this namespace's own
# network). See relayhub-java's own observability/prometheus/prometheus.yml for the local-dev
# equivalent this mirrors.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: cleanbrain-me-relayhub-java
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: relayhub
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ["api:8080"]
