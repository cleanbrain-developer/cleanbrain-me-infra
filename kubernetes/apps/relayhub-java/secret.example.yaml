# Copy to secret.yaml (gitignored), fill in real values, then:
#   kubectl apply -f kubernetes/apps/relayhub-java/secret.yaml
# Never commit the real file.
#
# Shared by both postgres (POSTGRES_*, the official postgres image's own expected env vars) and
# api (SPRING_DATASOURCE_*/ADMIN_*, picked up automatically by Spring Boot's environment-variable
# relaxed binding — no code change or application.yml edit needed, OS env vars already take
# precedence over application.yml) via envFrom. SPRING_DATASOURCE_PASSWORD must stay in sync with
# POSTGRES_PASSWORD below. "postgres" is the in-cluster Service name
# (kubernetes/apps/relayhub-java/postgres/service.yaml), resolvable only inside the
# cleanbrain-me-relayhub-java namespace.
#
# ADMIN_USERNAME/ADMIN_PASSWORD (Spec 005, relayhub-java's own admin console — see that repo's
# specs/005-admin-console/spec.md and security/SecurityConfig.java): gate every write under
# /api/** (Source/Target/Subscription create/edit/delete, Delivery replay). The application
# default (admin/admin, see relayhub-java's application.yml) is for local dev ONLY -- it is
# publicly guessable, and relayhub-java.developer.cleanbrain.me is a public hostname. This Secret
# MUST override both before (re-)deploying Spec 005, or the admin console is effectively
# unauthenticated.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: cleanbrain-me-relayhub-java
type: Opaque
stringData:
  POSTGRES_DB: relayhub
  POSTGRES_USER: relayhub
  POSTGRES_PASSWORD: CHANGE_ME

  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/relayhub
  SPRING_DATASOURCE_USERNAME: relayhub
  SPRING_DATASOURCE_PASSWORD: CHANGE_ME

  ADMIN_USERNAME: CHANGE_ME
  # openssl rand -base64 24
  ADMIN_PASSWORD: CHANGE_ME
