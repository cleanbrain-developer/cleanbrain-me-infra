# Copy to secret.yaml, fill in real values, and never commit secret.yaml
# (it is gitignored). See README.md "Secrets" for the general policy.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: cleanbrain-me-visitor-counter
type: Opaque
stringData:
  DATABASE_PATH: /app/data/visitor-counter.db
  # Long random value -- HMAC salt used to hash client IPs before storage.
  # Generate with: openssl rand -base64 48
  VISITOR_IP_HASH_SALT: "REPLACE_ME"
  # Comma-separated, no spaces: exactly the 5 frontend origins allowed to
  # call this API from the browser.
  ALLOWED_ORIGINS: "https://cleanbrain.me,https://developer.cleanbrain.me,https://english-core-speaking.cleanbrain.me,https://relayhub-java.developer.cleanbrain.me,https://crm-discount.kioti.cleanbrain.me"
  VISITOR_RETENTION_DAYS: "3"
