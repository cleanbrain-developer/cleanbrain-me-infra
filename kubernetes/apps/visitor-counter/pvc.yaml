# SQLite data file lives here (see secret.example.yaml DATABASE_PATH and
# deployment.yaml's volumeMount at /app/data). ReadWriteOnce is sufficient
# because the app runs as a single replica -- SQLite does not support
# concurrent writers across pods, so this must never be scaled beyond
# replicas: 1 without first moving off SQLite.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  namespace: cleanbrain-me-visitor-counter
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 512Mi
